    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Cresenix Solutions LLP",
      "alternateName": "Cresenix Solutions",
      "url": "https://cresenixsolutions.com",

      "foundingDate": "2022",
      "founders": [
        {
          "@type": "Person",
          "name": "Raj Bhandari",
          "jobTitle": "Founder & CEO"
        }
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Pune",
        "addressRegion": "Maharashtra",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-7387792415",
        "contactType": "customer service",
        "availableLanguage": ["English", "Hindi", "Marathi"]
      },
      "sameAs": [
        "https://www.linkedin.com/company/cresenix-solutions",
        "https://github.com/cresenix"
      ],

        "AI Chatbots",
        "Mobile App Development",
        "ERP Systems",
        "Learning Management Systems",
        "Digital Marketing",
        "Workflow Automation"
      ]
    }
    </script>

    <!-- JSON-LD Structured Data: WebSite (enables sitelinks search) -->

    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cresenix Solutions LLP",
      "url": "https://cresenixsolutions.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://cresenixsolutions.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
